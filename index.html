<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Audgoodian Digest</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f1115;
    color:white;
}

h1 {
    text-align:center;
    color:#4dd0e1;
    padding:20px;
    font-size:28px;
    letter-spacing:1px;
}

.container {
    max-width:900px;
    margin:auto;
    padding:10px;
}

.card {
    background:#1a1d24;
    border:1px solid #222;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
}

.card h3 {
    margin:0 0 8px 0;
    font-size:18px;
    color:#e6e6e6;
}

.ticker {
    height:90px;
}
</style>
</head>

<body>

<h1>Audgoodian Digest</h1>

<div class="container">

    <div class="card">
        <h3>SPYM</h3>
        <div id="spym" class="ticker"></div>
    </div>

    <div class="card">
        <h3>IAU</h3>
        <div id="iau" class="ticker"></div>
    </div>

    <div class="card">
        <h3>USO</h3>
        <div id="uso" class="ticker"></div>
    </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// SPYM (UPDATED)
new TradingView.widget({
    container_id: "spym",
    symbol: "SPYM",
    width: "100%",
    height: 90,
    theme: "dark",
    style: "1",
    hide_legend: true,
    hide_volume: true
});

// IAU
new TradingView.widget({
    container_id: "iau",
    symbol: "IAU",
    width: "100%",
    height: 90,
    theme: "dark",
    style: "1",
    hide_legend: true,
    hide_volume: true
});

// USO
new TradingView.widget({
    container_id: "uso",
    symbol: "USO",
    width: "100%",
    height: 90,
    theme: "dark",
    style: "1",
    hide_legend: true,
    hide_volume: true
});

</script>

</body>
</html>
