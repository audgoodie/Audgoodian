<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Audgoodian Digest</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f1115;
    color:white;
}

h1 {
    text-align:center;
    color:#4dd0e1;
    padding:20px;
    font-size:32px;
}

/* BIGGER CARDS */
.container {
    max-width:900px;
    margin:auto;
    padding:10px;
}

.card {
    background:#1a1d24;
    border:1px solid #222;
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
}

/* BIG TICKER LABEL (THIS IS THE KEY CHANGE) */
.ticker-title {
    font-size:26px;
    font-weight:bold;
    margin-bottom:10px;
    color:#ffffff;
    letter-spacing:1px;
}

/* BIGGER WIDGET AREA */
.ticker {
    height:140px;
}
</style>
</head>

<body>

<h1>Audgoodian Digest</h1>

<div class="container">

    <div class="card">
        <div class="ticker-title">SPYM</div>
        <div id="spym" class="ticker"></div>
    </div>

    <div class="card">
        <div class="ticker-title">IAU</div>
        <div id="iau" class="ticker"></div>
    </div>

    <div class="card">
        <div class="ticker-title">USO</div>
        <div id="uso" class="ticker"></div>
    </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// SPYM
new TradingView.widget({
    container_id: "spym",
    symbol: "SPYM",
    width: "100%",
    height: 140,
    theme: "dark",
    style: "1",
    hide_legend: true,
    hide_volume: true
});

// IAU
new TradingView.widget({
    container_id: "iau",
    symbol: "IAU",
    width: "100%",
    height: 140,
    theme: "dark",
    style: "1",
    hide_legend: true,
    hide_volume: true
});

// USO
new TradingView.widget({
    container_id: "uso",
    symbol: "USO",
    width: "100%",
    height: 140,
    theme: "dark",
    style: "1",
    hide_legend: true,
    hide_volume: true
});

</script>

</body>
</html>
