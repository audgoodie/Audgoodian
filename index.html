<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Audgoodian Digest</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f1115;
    color:white;
}

h1 {
    text-align:center;
    color:#4dd0e1;
    padding:15px;
}

.grid {
    display:grid;
    grid-template-columns: 1fr;
    gap:20px;
    padding:20px;
}

.widget {
    height:400px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #222;
}
</style>
</head>

<body>

<h1>Audgoodian Digest</h1>

<div class="grid">

    <div class="widget">
        <div class="tradingview-widget-container">
            <div id="spy"></div>
        </div>
    </div>

    <div class="widget">
        <div class="tradingview-widget-container">
            <div id="iau"></div>
        </div>
    </div>

    <div class="widget">
        <div class="tradingview-widget-container">
            <div id="uso"></div>
        </div>
    </div>

</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
    "container_id": "spy",
    "symbol": "SPY",
    "interval": "1D",
    "theme": "dark",
    "style": "1",
    "width": "100%",
    "height": 400
});

new TradingView.widget({
    "container_id": "iau",
    "symbol": "IAU",
    "interval": "1D",
    "theme": "dark",
    "style": "1",
    "width": "100%",
    "height": 400
});

new TradingView.widget({
    "container_id": "uso",
    "symbol": "USO",
    "interval": "1D",
    "theme": "dark",
    "style": "1",
    "width": "100%",
    "height": 400
});
</script>

</body>
</html>
