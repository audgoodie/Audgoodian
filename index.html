<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Audgoodian Digest</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f1115;
    color: #e6e6e6;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #4dd0e1;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.panel {
    background: #1a1d24;
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
}

input, button {
    padding: 8px;
    margin: 5px;
    border-radius: 6px;
    border: none;
}

button {
    cursor: pointer;
    background: #4dd0e1;
    font-weight: bold;
}

.ticker {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-bottom: 1px solid #333;
    cursor: pointer;
}

.ticker:hover {
    background: #222733;
}

.positive { color: #00e676; }
.negative { color: #ff5252; }

canvas {
    background: #111;
    border-radius: 10px;
    padding: 10px;
}
</style>
</head>

<body>

<h1>Audgoodian Digest</h1>

<div class="container">

<div class="panel">
    <h2>Tickers</h2>

    <input id="tickerInput" placeholder="Add ticker (SPY, IAU, USO)" />
    <button onclick="addTicker()">Add</button>

    <div id="tickerList"></div>
</div>

<div class="panel">
    <h2>Chart</h2>
    <canvas id="chart"></canvas>
</div>

</div>

<script>
let tickers = ["SPY", "IAU", "USO"];
let chart;

// -------------------- ADD / REMOVE --------------------
function addTicker() {
    let t = document.getElementById("tickerInput").value.toUpperCase().trim();
    if (!t) return;
    if (!tickers.includes(t)) tickers.push(t);
    renderTickers();
    document.getElementById("tickerInput").value = "";
}

function removeTicker(t) {
    tickers = tickers.filter(x => x !== t);
    renderTickers();
}

// -------------------- PRICE DATA --------------------
async function fetchQuote(symbol) {
    try {
        const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbol}`;
        const res = await fetch(url);
        const data = await res.json();

        const result = data.quoteResponse.result[0];

        if (!result) return null;

        return {
            price: result.regularMarketPrice,
            change: result.regularMarketChangePercent
        };

    } catch (e) {
        return null;
    }
}

// -------------------- CHART DATA --------------------
async function fetchChart(symbol) {
    try {
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1mo&interval=1d`;
        const res = await fetch(url);
        const data = await res.json();

        const result = data.chart.result[0];

        const timestamps = result.timestamp;
        const prices = result.indicators.quote[0].close;

        const labels = timestamps.map(t => {
            const d = new Date(t * 1000);
            return `${d.getMonth()+1}/${d.getDate()}`;
        });

        return { labels, prices };

    } catch (e) {
        return null;
    }
}

// -------------------- RENDER TICKERS --------------------
async function renderTickers() {
    const box = document.getElementById("tickerList");
    box.innerHTML = "";

    for (let t of tickers) {

        const data = await fetchQuote(t);

        if (!data) continue;

        const cls = data.change >= 0 ? "positive" : "negative";

        const div = document.createElement("div");
        div.className = "ticker";

        div.innerHTML = `
            <span>
                <b>${t}</b> :
                $${data.price.toFixed(2)}
                <span class="${cls}">
                    (${data.change.toFixed(2)}%)
                </span>
            </span>
            <button onclick="removeTicker('${t}')">X</button>
        `;

        div.onclick = () => loadChart(t);

        box.appendChild(div);
    }
}

// -------------------- LOAD CHART --------------------
async function loadChart(symbol) {

    const data = await fetchChart(symbol);

    if (!data) return;

    const ctx = document.getElementById("chart");

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "line",
        data: {
            labels: data.labels,
            datasets: [{
                label: symbol,
                data: data.prices,
                borderColor: "#4dd0e1",
                fill: false,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true }
            }
        }
    });
}

// init
renderTickers();
loadChart("SPY");
</script>

</body>
</html>
