<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Audgoodian Digest</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0f1115;
    color:white;
}

h1 {
    text-align:center;
    color:#4dd0e1;
    padding:20px;
    font-size:32px;
}

.container {
    max-width:500px;
    margin:auto;
    padding:10px;
}

.tile {
    background:#1a1d24;
    border:1px solid #222;
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
    text-align:center;
}

.ticker {
    font-size:28px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:10px;
}

.price-box {
    height:80px;
}
</style>
</head>

<body>

<h1>Audgoodian Digest</h1>

<div class="container">

    <div class="tile">
        <div class="ticker">SPYM</div>
        <div id="spym" class="price-box"></div>
    </div>

    <div class="tile">
        <div class="ticker">IAU</div>
        <div id="iau" class="price-box"></div>
    </div>

    <div class="tile">
        <div class="ticker">USO</div>
        <div id="uso" class="price-box"></div>
    </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>

// IMPORTANT:
// SPYM is DISPLAY NAME only
// Data source is SPY (because SPYM is not a real market symbol)

new TradingView.widget({
    container_id: "spym",
    symbol: "SPYM",   // actual market data
    width: "100%",
    height: 80,
    theme: "dark",
    style: "2",
    hide_legend: true,
    hide_volume: true
});

new TradingView.widget({
    container_id: "iau",
    symbol: "IAU",
    width: "100%",
    height: 80,
    theme: "dark",
    style: "2",
    hide_legend: true,
    hide_volume: true
});

new TradingView.widget({
    container_id: "uso",
    symbol: "USO",
    width: "100%",
    height: 80,
    theme: "dark",
    style: "2",
    hide_legend: true,
    hide_volume: true
});

</script>

</body>
</html>
